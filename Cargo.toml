[package]
name = "xool-files"
version = "0.1.0"
edition = "2024"
authors = ["Vyxen Apps"]
homepage = "https://github.com/VyxenApps"
description = "A native Windows file manager built with Rust and GPUI"
license = "GPL-3.0-only"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
anyhow = "1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
notify = "7"
tempfile = "3"
url = "2.5"
raw-window-handle = "0.6"
rodio = { version = "0.23", default-features = false, features = [
  "playback",
  "symphonia-aac",
  "symphonia-flac",
  "symphonia-isomp4",
  "symphonia-mkv",
  "symphonia-mp3",
  "symphonia-ogg",
  "symphonia-pcm",
  "symphonia-vorbis",
  "symphonia-wav"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
symphonia = { version = "0.5.5", default-features = false, features = [
  "aac",
  "flac",
  "isomp4",
  "mkv",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav"
] }
windows-core = "0.61"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.dev]
opt-level = 1
debug = false
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true

[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui-component = { path = "vendor/gpui-component" }
